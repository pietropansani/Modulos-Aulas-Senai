<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>- Estilo -</title>
    <!-- CSS  Interno  -->
    <!-- Ele fica dentro da tag <style>  no <head> do HTML-->
    <style>
        h1 {
            color: black;

        }
    </style>
<!--############################################### -->
    <!-- CSS Externo  - O MELHOR DE TODOS!! -->
    <link rel="stylesheet" href="./css/style.css">
<!--############################################### -->

</head>
<body>

    <!-- CSS (Cascading Style Sheets) é o que da forma, cor, design e estilo ao HTML -->
    <!-- CSS inline -->
    <!-- Definido diretamente na tag HTML, dentro de atributo style -->
    <!-- Quando usar?
    Quando vc precisa estilizar um unico elemento rapidamente (ex: testar uma cor ddiferente em um botão)
    -->

    <h1 style="font-size: 24px ;">Titulo</h1>
    <h2>DSI1 - SESI  </h2>

</body>
</html>
