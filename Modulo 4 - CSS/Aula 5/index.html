<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aula 5 - CSS</title>
    <link rel="stylesheet" href="./css/style.css">
</head>
<body>

    <h1>Entendendo o Display</h1>

    <p>
        O <strong>display</strong> define como um elemento se comporta na página, ou seja, como ele será exibido. Existem diversos valores para a propriedade <strong>display</strong>, sendo os mais comuns: <strong>block</strong>, <strong>inline</strong> e <strong>inline-block</strong>.
    </p>


    <!-- BLOCK -->
     <h2>1. Block</h2>
     <div class="block">Caixa 1</div>
     <div class="block">Caixa 2</div>
     <div class="block">Caixa 3</div>

    <!-- INLINE -->
    <h2>2. Inline</h2>
    <span class="inline">Caixa 1</span>
    <span class="inline">Caixa 2</span>
    <span class="inline">Caixa 3</span>
</body>
</html>
