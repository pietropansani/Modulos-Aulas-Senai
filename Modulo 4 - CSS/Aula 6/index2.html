    <h1>FLEXBOX</h1>

    <p>O Flexbox é um modelo de layout unidimensional que permite organizar elementos em uma única linha ou coluna,
        facilitando o alinhamento e a distribuição de espaço entre eles.</p>


    <div class="container">
        <div class="box">1</div>
        <div class="box">2</div>
        <div class="box">3</div>
        <div class="box">4</div>
    </div>
