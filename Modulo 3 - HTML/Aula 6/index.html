<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <table border="1">
        <thead>
            <tr>
                <th>Nome</th>
                <th>Idade</th>
                <th>Cidade</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>Pietro</td>
                <td>17</td>
                <td>Guarulhos</td>
            </tr>
        </tbody>
    </table>

    <!-- TABELAS -->
    <!--
    <table> = Define a tabela
    <thead> = Define a região do Cabeçalho
    <tr> = Define uma linha de tabela
    <tbody> = Define a região do corpo
    <td> = Define uma célula (dados da tabela)
    border="1" = Adiciona bordas na tabela
    -->
</body>
</html>
