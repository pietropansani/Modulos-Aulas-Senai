<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aula 7</title>
</head>
<thead>

</thead>
<body>

    <!--
    <form> = Define um formulário
    <input> = Campo de entrada (Com vários tipos: text, password, email, number, etc...)
    <label> = Associa um texto descritivo a um <input>
    <textarea>  = Área de texto maior
    <select> e <option> = Cria menus suspensos (dropdowns)
    <button> = Botão  clicável
    <fieldset> e <legend> = Agrupam e nomeiam partes de um formulário
    <datalist> = Lista de sugestôes para <input>
    -->

    <h1>Formulário Completo</h1>
    <form action="/enviar-dados" method="post">
        <fieldset>
            <legend>Informações Pessoais</legend>

            <label for="nome">Nome Completo:</label>
            <input type="text" id="nome" name="nome" placeholder="Digite seu Nome" required><br>

            <label for="email">E-mail:</label>
            <input type="text" id="email" name="email"
            placeholder="Digite seu E-Mail" required><br>

            <label for="senha">Senha:</label>
            <input type="password" name="password" id="passoword" placeholder="Digite sua Senha" required><br>

            <label for="idade">Idade:</label>
            <input type="number" id="idade" name="idade" min="18" max="99"><br>

            <label for="data-nascimento">Data de Nascimento</label>
            <input type="date" name="data-nascimento" id="data-nascimento"><br>

            <label for="genero">Gênero</label>
            <select name="genero" id="genero">
                <option value="masculino">Masculino</option>
                <option value="feminino">Feminino</option>
                <option value="outro">Outro</option>
                <option value="prefiro_nao_dizer">Prefiro Não Dizer</option>
            </select>
        </fieldset>

        <fieldset>
            <legend>Detalhes Adicionais</legend>
            <label for="bio">Sobre Você</label>
            <textarea name="bio" id="bio" rows="3" placeholder="Fale um pouco sobre você..."></textarea><br>

            <label for="linguagem">Linguagem Favorito:</label>
            <input type="text" name="linguagem" id="linguagem" list="linguagens">
            <datalist id="linguagens">
                <option value="HTML"></option>
                <option value="CSS"></option>
                <option value="JavaScript"></option>
                <option value="Python"></option>
                <option value="Java"></option>
                <option value="C++"></option>
                <option value="C#"></option>


            </datalist>

        </fieldset>

    </form>



</body>
</html>
