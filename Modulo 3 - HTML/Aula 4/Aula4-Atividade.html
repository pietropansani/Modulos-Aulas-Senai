<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Séries Favoritas</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #000000, #2b2b2b);
            color: white;
            min-height: 100vh;
            padding: 40px;
        }

        h1 {
            text-align: center;
            font-size: 42px;
            margin-bottom: 40px;
            color: #f1f1f1;
            text-transform: uppercase;
            letter-spacing: 3px;
        }

        ul {
            list-style: none;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 30px;
            max-width: 1200px;
            margin: auto;
        }

        li {
            background: #161616;
            border: 1px solid #444;
            border-radius: 15px;
            padding: 20px;
            text-align: center;
            font-size: 24px;
            font-weight: bold;
            color: #ddd;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            transition: 0.3s;
        }

        li:hover {
            transform: translateY(-10px);
            background: #242424;
            border-color: #888;
        }

        img {
            margin-top: 20px;
            width: 100%;
            height: 350px;
            object-fit: cover;
            border-radius: 12px;
            filter: grayscale(20%);
            transition: 0.3s;
        }

        img:hover {
            filter: grayscale(0%);
            transform: scale(1.03);
        }

        @media(max-width: 600px) {
            body {
                padding: 20px;
            }

            h1 {
                font-size: 30px;
            }

            img {
                height: 300px;
            }
        }
    </style>
</head>

<body>
