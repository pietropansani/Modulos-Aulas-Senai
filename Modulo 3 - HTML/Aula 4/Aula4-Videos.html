<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Top 3 Melhores Jogadores da Minha Geração</title>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial, Helvetica, sans-serif;
        }

        body{
            background:linear-gradient(to bottom,#000,#111,#222);
            color:white;
            text-align:center;
        }

        header{
            padding:40px 20px;
        }

        header h1{
            font-size:45px;
            color:#d9d9d9;
            text-shadow:0 0 15px #555;
        }

        header p{
            color:#bbb;
            margin-top:10px;
        }

        .card{
            width:80%;
            max-width:850px;
            margin:40px auto;
            background:#2a2a2a;
            padding:25px;
            border-radius:20px;
            box-shadow:0 0 20px rgba(255,255,255,.08);
            transition:.4s;
        }

        .card:hover{
            transform:scale(1.03);
            box-shadow:0 0 25px #777;
        }

        h2{
            margin-bottom:20px;
            color:#d0d0d0;
        }

        iframe{
            width:100%;
            height:450px;
            border:none;
            border-radius:15px;
        }

        footer{
            margin-top:50px;
            padding:20px;
            background:#111;
            color:#999;
            font-size:18px;
        }

        @media(max-width:768px){
            iframe{
                height:250px;
            }

            header h1{
                font-size:30px;
            }

            .card{
                width:95%;
            }
        }
    </style>
</head>

<body>

<header>
    <h1>⚽ Top 3 Melhores Jogadores da Minha Geração ⚽</h1>
    <p>Uma homenagem aos craques que marcaram época.</p>
</header>

<div class="card">
    <h2>🥇 Top 1 - Cristiano Ronaldo</h2>
    <iframe
        src="https://www.youtube.com/embed/mmeLCAP74KA?autoplay=1&mute=1&loop=1&playlist=mmeLCAP74KA"
        title="Cristiano Ronaldo"
        allow="autoplay; encrypted-media"
        allowfullscreen>
    </iframe>
</div>

<div class="card">
    <h2>🥈 Top 2 - Lionel Messi</h2>
    <iframe
        src="https://www.youtube.com/embed/nA8wHQvHPJU?autoplay=1&mute=1&loop=1&playlist=nA8wHQvHPJU"
        title="Lionel Messi"
        allow="autoplay; encrypted-media"
        allowfullscreen>
    </iframe>
</div>

<div class="card">
    <h2>🥉 Top 3 - Neymar Jr</h2>
    <iframe
        src="https://www.youtube.com/embed/OWOjRdmpM6I?autoplay=1&mute=1&loop=1&playlist=OWOjRdmpM6I"
        title="Neymar Jr"
        allow="autoplay; encrypted-media"
        allowfullscreen>
    </iframe>
</div>

<footer>
    ⚽ Desenvolvido por você • 2026
</footer>

</body>
</html>
